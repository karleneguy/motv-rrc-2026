<style>
  :root{
    --bg:#f5f7fa;
    --surface:#ffffff;
    --surface-soft:#f9fbfc;
    --ink:#17212b;
    --muted:#617080;
    --line:#d9e0e7;
    --blue:#185b8f;
    --blue-dark:#10456f;
    --blue-soft:#eaf3f9;
    --green:#1f7a55;
    --green-soft:#eaf7f0;
    --gold:#9a6800;
    --gold-soft:#fff6d9;
    --red:#ad2f2f;
    --red-soft:#fff0f0;
    --shadow:0 10px 30px rgba(22, 43, 64, .07);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    color:var(--ink);
    background:linear-gradient(180deg,#eef4f8 0,#f7f8fa 320px,#f7f8fa 100%);

    line-height:1.5;
  }
  button,input,textarea{font:inherit}
  button{cursor:pointer}
  a{color:var(--blue)}
  .shell{max-width:980px;margin:0 auto;padding:28px 18px 64px}
  .hero{
    background:linear-gradient(135deg,#123e62,#1b6c9b);
    color:#fff;
    border-radius:24px;
    padding:30px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
  }
  .eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:.78rem;font-weight:800;opacity:.78}
  h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.05;margin:8px 0 10px}
  .hero p{margin:0;max-width:760px;font-size:1.03rem;opacity:.92}
  .notice,.card,.optional-panel,.submit-panel,.review-panel,.dashboard-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .notice{padding:16px 18px;margin:16px 0;color:#334555;background:#fbfdff}
  .notice strong{color:var(--ink)}
  .section-heading{margin:36px 0 12px}
  .section-heading h2{font-size:1.55rem;margin:0 0 5px}
  .section-heading p{margin:0;color:var(--muted)}
  .card{padding:22px;margin:14px 0}
  .qtop{display:flex;gap:14px;align-items:flex-start}
  .qnum{
    flex:0 0 auto;
    width:34px;height:34px;border-radius:10px;
    display:grid;place-items:center;
    background:var(--blue-soft);color:var(--blue-dark);font-weight:850;
  }
  .qtext{font-size:1.16rem;font-weight:800;line-height:1.35;margin:2px 0 4px}
  .qhint,.small{color:var(--muted);font-size:.91rem}
  .scope-note{margin:14px 0;padding:13px 14px;border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:10px;color:#28495e;font-size:.94rem}
  .options{display:grid;gap:9px;margin-top:16px}
  .option{
    display:flex;gap:12px;align-items:flex-start;
    border:1px solid var(--line);
    border-radius:13px;
    padding:12px 13px;
    background:#fff;
    transition:.15s ease;
  }
  .option:hover{border-color:#9eb4c5;background:#fcfeff}
  .option.selected{border-color:#6c9fc1;background:#f2f8fc}
  .option input{width:19px;height:19px;margin-top:2px;accent-color:var(--blue);flex:0 0 auto}
  .option-text{font-weight:620}
  .optional-panel{margin-top:30px;overflow:hidden}
  .optional-head{padding:22px;background:#f0f6f8;border-bottom:1px solid var(--line)}
  .optional-head h2{margin:0 0 6px;font-size:1.55rem}
  .optional-head p{margin:0;color:#4f6473}
  .optional-body{padding:22px}
  .field-group{padding:18px 0;border-bottom:1px solid #edf0f3}
  .field-group:last-child{border-bottom:0}
  .field-label{font-weight:790;margin-bottom:9px;display:block}
  .choice-row{display:flex;flex-wrap:wrap;gap:9px}
  .choice-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff}
  .choice-pill input{accent-color:var(--blue)}
  textarea,input[type="text"],input[type="email"]{
    width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;
  }
  textarea{min-height:92px;resize:vertical}
  textarea:focus,input[type="text"]:focus,input[type="email"]:focus{border-color:#70a5c8;box-shadow:0 0 0 3px rgba(24,91,143,.09)}
  .conditional{display:none;margin-top:10px}
  .conditional.show{display:block}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .submit-panel{padding:22px;margin-top:24px}
  .ack{display:flex;gap:10px;align-items:flex-start;background:#f9fbfc;border:1px solid var(--line);border-radius:13px;padding:13px}
  .ack input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue)}
  .lock-note{margin:12px 0;color:var(--muted);font-size:.9rem}
  .error{display:none;color:var(--red);background:var(--red-soft);border:1px solid #efc2c2;border-radius:11px;padding:10px 12px;margin:12px 0;font-weight:650}
  .error.show{display:block}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn{border:0;border-radius:11px;min-height:46px;padding:11px 17px;font-weight:800}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-dark)}
  .btn-secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .hidden{display:none!important}
  .review-panel{padding:24px;margin-top:20px}
  .review-panel h2{margin-top:0}
  .review-summary{background:var(--green-soft);border:1px solid #bfe3cf;border-radius:13px;padding:14px 15px;margin-bottom:18px}
  .review-item{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;background:#fff}
  .review-item.missed{border-left:5px solid var(--red)}
  .review-item.nuance{border-left:5px solid var(--gold)}
  .review-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;font-weight:850;color:var(--muted);margin-bottom:5px}
  .review-title{font-weight:820;margin-bottom:5px}
  .status{display:inline-block;border-radius:999px;padding:3px 8px;font-size:.77rem;font-weight:850;margin-left:6px}
  .status.correct{background:var(--green-soft);color:var(--green)}
  .status.depends{background:var(--gold-soft);color:var(--gold)}
  .status.incorrect{background:var(--red-soft);color:var(--red)}
  .why{margin:8px 0 0;color:#344755}
  .refs{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
  .refs h3{margin:0 0 10px}
  .refs ol{padding-left:22px}
  .refs li{margin:8px 0;color:#3f5260}
  .footer{color:var(--muted);font-size:.84rem;margin-top:22px;text-align:center}
  .mode-banner{padding:11px 13px;background:var(--gold-soft);border:1px solid #ecd798;border-radius:11px;margin:0 0 18px;color:#644b10}
  .dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 20px}
  .metric{padding:17px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
  .metric .n{font-size:1.7rem;font-weight:900}
  .metric .lab{color:var(--muted);font-size:.85rem}
  .dashboard-card{padding:20px;margin:14px 0}
  .dashboard-card h3{margin:0 0 12px}
  .bar-row{margin:10px 0}
  .bar-label{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;margin-bottom:4px}
  .bar-bg{height:9px;background:#edf0f3;border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;background:var(--blue);border-radius:99px}
  .comment{padding:10px 0;border-bottom:1px solid #edf0f3;color:#405462}
  .comment:last-child{border-bottom:0}
  .tag{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef2f5;color:#526474;font-size:.75rem;font-weight:750}
  @media print{
    @page{margin:14mm}
    body{background:#fff}
    .shell{max-width:none;padding:0}
    .actions,.footer,.notice,.mode-banner{display:none!important}
    .hero{box-shadow:none;border:0;padding:0 0 14px;margin:0 0 12px;background:#fff;color:#000}
    .hero .eyebrow,.hero p{color:#333}
    .review-panel{box-shadow:none;border:0;padding:0;margin:0}
    .review-item{break-inside:avoid;page-break-inside:avoid}
    .refs li{break-inside:avoid;page-break-inside:avoid}
    a{color:#000;text-decoration:none}
  }
  @media(max-width:700px){
    .shell{padding:14px 12px 45px}
    .hero{padding:22px 19px;border-radius:18px}
    .card,.optional-body,.submit-panel,.review-panel{padding:17px}
    .two-col,.dashboard-grid{grid-template-columns:1fr}
    .qtop{gap:10px}.qnum{width:30px;height:30px}
  }
</style>

<style>
.start-panel{margin-top:22px}
.quiz-section{scroll-margin-top:18px}
.question-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.question-status{font-size:.86rem;color:var(--muted);font-weight:750}
.locked-status{color:var(--green)}
.error-inline{color:#a33}
.locked-question{border-color:#c9dfd3;background:linear-gradient(180deg,#fff,#fbfefc)}
.locked-question .option{cursor:default}
.locked-question .option:not(.selected){opacity:.72}
.question-feedback{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.question-feedback.show{display:block}
.feedback-title{font-weight:850;margin-bottom:10px}
.feedback-ok{background:var(--greenSoft);border:1px solid #cbe7d7;color:#205f47;border-radius:12px;padding:12px}
.mini-refs{margin-top:10px;color:var(--muted);font-size:.82rem}
#afterMainArea{display:none}
</style>

<script>
/*
  MAKING OXYGEN THERAPY VISIBLE™ — STANDALONE FRONT-END
  ------------------------------------------------------
  Default mode is participant mode.
  Presenter dashboard: add ?dashboard=1 to the page URL.

  DATA MODE
  - With REMOTE_API_URL left blank, submissions are stored in localStorage.
    This is useful for testing, but it is NOT a cross-device live dashboard.
  - To make the dashboard live across participant devices, set REMOTE_API_URL
    to an endpoint that:
       POST  accepts one submission JSON object
       GET   returns an array of submission JSON objects
    No quiz/UI rewrite is required.
*/

const references = {
  odriscoll2017: {

  },

  },
  khanna2020: {
    short: "Khanna et al., 2020",
    full: "Khanna AK, et al. Prediction of opioid-induced respiratory depression on inpatient wards using continuous capnography and oximetry: the PRODIGY trial. Anesthesia & Analgesia. 2020;131(4):1012–1024."
  },

  },
  seeley2015: {

  },

  fawzy2022: {

  },
  downey2018: {
    short: "Downey et al., 2018",
    full: "Downey CL, Chapman S, Randell R, Brown JM, Jayne DG. The impact of continuous versus intermittent vital signs monitoring in hospitals: a systematic review and narrative synthesis. International Journal of Nursing Studies. 2018;84:19–27. doi:10.1016/j.ijnurstu.2018.04.013."
  },

    short: "Moga & Chojecki, 2016",
    full: "Moga C, Chojecki D. Oxygen therapy in acute care settings: a review of guidelines and recommendations. CADTH. 2016."
  },
  who2020: {
    short: "WHO, 2020",
    full: "World Health Organization. Oxygen sources and distribution for health care facilities. 2020."
  },
  medford2009: {
    short: "Medford et al., 2009",
    full: "Medford ARL, et al. Clinical considerations in oxygen delivery and Venturi-device performance. 2009."
  },
  tang2024: {
    short: "Tang et al., 2024",
    full: "Tang et al. Study of breathing pattern, inspiratory demand and delivered oxygen concentration with nasal cannula oxygen. 2024."
  },
  buchan2024: {
    short: "Buchan et al., 2024",
    full: "Buchan et al. Implementing oxygen therapy in medical wards: a scoping review. Journal of Clinical Medicine. 2024;13(18):5506."
  },
  ahs2020: {
    short: "Alberta Health Services, 2020",
    full: "Alberta Health Services. Oxygen therapy and weaning guidance referenced in the MOTV evidence review. 2020."
  },
  brown2025: {
    short: "Brown et al., 2025",
    full: "Brown D, Birhanu D, Lauri M, Lubo O, Too PK, Naidu K, Ravinsdran V, Samor M. Global access to medical oxygen: embedding nursing involvement. The Lancet Global Health. 2025;13(3):e394–e395. doi:10.1016/S2214-109X(24)00499-6."
  },
  tariq2024: {
    short: "Tariq et al., 2024",
    full: "Tariq M, Siddhantakar A, Sherman JD, Cimprich A, Young SB. Life cycle assessment of medical oxygen. Journal of Cleaner Production. 2024;444:141126. doi:10.1016/j.jclepro.2024.141126."
  }
};

const quizSections = [
  {
    title:"1. Oxygen indications",
    questions:[{
      id:"q1",
      prompt:"Which of the following are clinical indications for supplemental oxygen therapy?",
      description:"For this question, carbon monoxide poisoning, cluster headache, decompression sickness, palliative/end-of-life care, and sickle cell crisis are considered out of scope.",
      type:"multi",
      options:[
        {id:"anxiety",text:"Anxiety/hyperventilation with normal SpO₂",grade:"wrong",why:"Anxiety or hyperventilation alone does not indicate a need for oxygen when oxygenation is adequate. Assess and treat the underlying cause.",refs:["odriscoll2017"]},
        {id:"copd",text:"COPD exacerbation with normal SpO₂",grade:"wrong",why:"A COPD exacerbation does not automatically mean the patient needs oxygen. Oxygen should be used when indicated and titrated to the appropriate target range.",refs:["barnett2022","odriscoll2017"]},
        {id:"hypovent",text:"Hypoventilation with normal SpO₂",grade:"wrong",why:"Oxygen does not correct inadequate ventilation or remove CO₂. If oxygenation is adequate, supplemental oxygen is not a treatment for hypoventilation itself. Assess and address the cause of inadequate ventilation.",refs:["odriscoll2017","khanna2020"]},
        {id:"hypox",text:"Hypoxaemia",grade:"correct",why:"Hypoxaemia is the usual indication for supplemental oxygen in acute care.",refs:["barnett2022","odriscoll2017"]},
        {id:"pneumonia",text:"Pneumonia with normal SpO₂",grade:"wrong",why:"Pneumonia can cause hypoxaemia, but the diagnosis itself does not mean oxygen is needed when oxygenation is adequate.",refs:["odriscoll2017"]},
        {id:"dyspnea",text:"Shortness of breath/dyspnea with normal SpO₂",grade:"wrong",why:"Dyspnoea is a symptom, not a measure of oxygenation. A patient may be very breathless without being hypoxaemic.",refs:["barnett2022","odriscoll2017"]},
        {id:"suspected",text:"Suspected hypoxaemia when reliable SpO₂ cannot be obtained",grade:"partial",why:"An unreliable SpO₂ does not prove hypoxaemia. However, if the patient appears acutely unwell and hypoxaemia is clinically suspected, oxygen may need to be started while a reliable measurement or arterial blood gas is obtained.",refs:["barnett2022"]},
        {id:"prevent",text:"To prevent possible desaturation if a patient deteriorates",grade:"wrong",why:"Oxygen should not routinely be given as a ‘safety buffer’ to an adequately oxygenated patient. Oxygen is a therapy that should have an indication and target.",refs:["barnett2022","chu2018"]},
        {id:"unsure",text:"I’m not confident in my answer",grade:"confidence",confidence:true,why:"",refs:[]}
      ],}]
  },
  {
    title:"2. Identifying hypoxaemia",
    questions:[{
      id:"q2",
      prompt:"How is hypoxaemia identified in acute care?",
      type:"multi",
      options:[
        {id:"abg",text:"Arterial blood gas (PaO₂)",grade:"correct",why:"An arterial blood gas directly measures PaO₂ and provides more precise information about arterial oxygenation when required.",refs:["barnett2022","odriscoll2017"]},
        {id:"co2",text:"CO₂ level on a blood gas (PaCO₂ or PvCO₂)",grade:"wrong",why:"CO₂ primarily provides information about ventilation and acid-base physiology. It does not determine whether the patient is hypoxaemic.",refs:["barnett2022"]},
        {id:"cyanosis",text:"Cyanosis",grade:"partial",why:"Cyanosis can increase suspicion of hypoxaemia, but it is not reliable enough to determine oxygenation by itself. Appearance can be affected by perfusion, haemoglobin level, lighting and other factors.",refs:["odriscoll2017"]},
        {id:"spo2",text:"Pulse oximetry (SpO₂)",grade:"correct",why:"Pulse oximetry is the routine non-invasive method used to estimate arterial oxygen saturation and screen for hypoxaemia.",refs:["barnett2022","pretto2014"]},
        {id:"rr",text:"Respiratory rate",grade:"wrong",why:"An abnormal respiratory rate can signal deterioration, but it does not tell you whether arterial oxygen is low.",refs:["hill2020","odriscoll2017"]},
        {id:"sob",text:"Shortness of breath / Dyspnea",grade:"wrong",why:"Dyspnoea does not reliably identify hypoxaemia. A patient can be breathless with normal oxygenation or hypoxaemic without prominent breathlessness.",refs:["barnett2022","odriscoll2017"]},
        {id:"unsure",text:"I’m not confident in my answer",grade:"confidence",confidence:true,why:"",refs:[]}
      ],}]
  },
  {
    title:"3. Pulse oximetry limitations",
    questions:[{
      id:"q3",
      prompt:"Which of the following are limitations of pulse oximetry?",
      type:"multi",
      options:[
        {id:"false_reassurance",text:"A normal SpO₂ can create false reassurance that overall respiratory status is stable",grade:"correct",why:"SpO₂ measures oxygen saturation, not ventilation. Supplemental oxygen can maintain a reassuring saturation while bradypnoea, apnoea, hypoventilation or hypercapnia develops.",refs:["pretto2014","khanna2020"]},
        {id:"tissue",text:"A normal SpO₂ does not guarantee adequate oxygen delivery to the tissues",grade:"correct",why:"Oxygen delivery also depends on haemoglobin concentration, cardiac output and perfusion. A patient can therefore have a normal saturation but inadequate tissue oxygen delivery.",refs:["seeley2015","pretto2014"]},
        {id:"signal_factors",text:"Movement, shivering, poor circulation, cold extremities, sensor position, nail products, bright light or measurement site can affect the reading",grade:"correct",why:"Pulse oximetry relies on an adequate optical and pulsatile signal. Patient, sensor and environmental factors can impair measurement accuracy.",refs:["pretto2014","fda2025"]},
        {id:"paO2",text:"Does not show how high the PaO₂ is once saturation is near 100%",grade:"correct",why:"At high saturations, the oxyhaemoglobin dissociation curve flattens. A SpO₂ near 100% cannot tell you whether PaO₂ is moderately elevated or extremely high.",refs:["pretto2014","seeley2015"]},
        {id:"flowing",text:"Does not tell you whether oxygen is actually flowing or the delivery system is connected properly",grade:"correct",why:"SpO₂ measures the patient’s physiological response. It does not directly monitor the oxygen source, tubing, flowmeter or patient interface.",refs:["odriscoll2017","moga2016"]},
        {id:"intermittent",text:"Intermittent checks can miss changes between assessments",grade:"correct",why:"A spot reading only describes one moment in time. Desaturation or deterioration can occur between measurements.",refs:["downey2018","khanna2020"]},
        {id:"co",text:"May be misleading in abnormal haemoglobin states",grade:"correct",why:"Conventional pulse oximetry cannot reliably distinguish some abnormal haemoglobin species and can therefore produce misleading readings. For example, carboxyhaemoglobin can produce a falsely reassuring SpO₂.",refs:["pretto2014"]},
        {id:"skin",text:"May read falsely high in some people with darker skin",grade:"correct",why:"Studies have found greater risk of pulse oximetry overestimating arterial saturation in some patients with darker skin pigmentation. Performance varies by device and circumstance.",refs:["sjoding2020","fawzy2022"]},
        {id:"stale",text:"Signal averaging or poor signal quality can delay or distort the displayed SpO₂ response",grade:"correct",why:"The displayed value may not fully reflect a rapid change in the patient’s current oxygenation. Device behaviour varies when signal quality is poor or lost.",refs:["pretto2014","fda2025"]},
        {id:"unreliable_on_o2",text:"Supplemental oxygen makes the pulse oximeter itself less accurate",grade:"wrong",why:"Supplemental oxygen does not inherently make the pulse oximeter less accurate. The concern is that a reassuring SpO₂ can persist despite worsening ventilation or respiratory depression, so SpO₂ must be interpreted alongside the patient’s overall respiratory assessment.",refs:["pretto2014","khanna2020"]},
        {id:"unsure",text:"I’m not confident in my answer",grade:"confidence",confidence:true,why:"",refs:[]}
      ],}]
  },
  {
    title:"4. Monitoring and reassessment",
    questions:[{
      id:"q4",
      prompt:"Which of the following should prompt more frequent monitoring or reassessment in a patient receiving oxygen?",
      type:"multi",
      options:[
        {id:"o2_need",text:"Oxygen requirement is new, increasing, or rising even though SpO₂ remains in target",grade:"correct",why:"A patient who requires more oxygen to maintain the same saturation may be deteriorating even though the displayed SpO₂ still looks acceptable.",refs:["barnett2022"]},
        {id:"breathing",text:"Respiratory rate, breathing pattern or work of breathing is abnormal or changing",grade:"correct",why:"Tachypnoea, bradypnoea, apnoea, abnormal breathing patterns or increasing work of breathing can signal deterioration independently of SpO₂.",refs:["hill2020","khanna2020"]},
        {id:"loc",text:"Level of consciousness has changed, including new drowsiness or confusion",grade:"correct",why:"Changes in consciousness may reflect hypoxaemia, hypercapnia, respiratory depression or other deterioration.",refs:["odriscoll2017","khanna2020"]},
        {id:"therapy_change",text:"Oxygen has been started, increased, reduced, weaned, stopped, or the delivery device has been changed",grade:"correct",why:"Changes in therapy should be followed by reassessment to determine whether the intended response occurred and whether the patient remains within target.",refs:["barnett2022","buchan2024"]},
        {id:"mismatch",text:"The SpO₂ signal is unreliable or does not match the patient’s clinical condition",grade:"correct",why:"A reassuring number should not override a concerning clinical assessment. Check the patient, sensor and signal and obtain further assessment when needed.",refs:["pretto2014","fda2025"]},

function esc(s=""){
  return String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
}
function shortRefs(ids=[]){return ids.map(id=>references[id]?.short).filter(Boolean).join("; ")}
function allQuestions(){return quizSections.flatMap(s=>s.questions)}
function questionById(id){return allQuestions().find(q=>q.id===id)}

function saveSession(session){localStorage.setItem(SESSION_KEY,JSON.stringify(session))}
function clearSession(){localStorage.removeItem(SESSION_KEY)}

async function api(payload){
  const r=await fetch(REMOTE_API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({event_key:EVENT_KEY,...payload})
  });
  const body=await r.json().catch(()=>({}));
  if(!r.ok){const err=new Error(body.error||"Request failed");err.status=r.status;throw err}
  return body;
}

async function startQuiz(){
  const mode=document.querySelector('[name="start_mode"]:checked')?.value;
  if(!mode) return;
  const btn=document.getElementById("startBtn");
  const err=document.getElementById("startError");
  err.classList.remove("show");
  btn.disabled=true;btn.textContent="Starting…";
  try{
    let session={mode,submissionId:null,token:null,lockedAnswers:{},completed:false};
    if(mode==="live"){
      const res=await api({action:"start",practising_nurse:true,first_submission_attested:true,quiz_version:QUIZ_VERSION});
      session.submissionId=res.submission_id;
      session.token=res.participant_token;
    }
    saveSession(session);
    document.getElementById("startPanel").style.display="none";
    document.getElementById("motvForm").style.display="block";
    applySessionState(session);
    document.querySelector('[data-question="q1"]')?.scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){
    btn.disabled=false;btn.textContent="Start quiz";
    err.textContent=e.message||"Could not start the quiz. Please try again.";
    err.classList.add("show");
  }
}

function readQuestionAnswer(q){
  const name=`${q.id}${q.type==="multi"?"[]":""}`;
  const selected=[...document.querySelectorAll(`[name="${name}"]:checked`)].map(x=>x.value);
  return q.type==="single"?(selected[0]||null):selected;
}

function answerIsPresent(q,answer){return q.type==="single"?Boolean(answer):Array.isArray(answer)&&answer.length>0}

async function submitMainQuestion(qid){
  const q=questionById(qid);
  const session=getSession();
  if(!q||!session) return;
  if(session.lockedAnswers?.[qid]!==undefined) return;

  const answer=readQuestionAnswer(q);
  const status=document.getElementById(`status_${qid}`);
  if(!answerIsPresent(q,answer)){
    status.textContent="Please choose at least one answer.";
    status.className="question-status error-inline";
    return;
  }

  const btn=document.querySelector(`[data-submit-question="${qid}"]`);
  btn.disabled=true;btn.textContent="Submitting…";
  status.textContent="";
  try{
    if(session.mode==="live"){
      await api({action:"question",submission_id:session.submissionId,participant_token:session.token,question_id:qid,answer});
    }
    session.lockedAnswers={...(session.lockedAnswers||{}),[qid]:answer};
    saveSession(session);
    lockQuestionCard(qid,answer,false);
    applyFlowVisibility(session);
    const next=nextMainId(qid);
    const target=next?document.querySelector(`[data-question="${next}"]`):document.querySelector('[data-first-question="q6a"]');
    setTimeout(()=>target?.scrollIntoView({behavior:"smooth",block:"start"}),180);
  }catch(e){
    btn.disabled=false;btn.textContent="Submit answer";
    status.textContent=e.message||"Could not save this answer. Please try again.";
    status.className="question-status error-inline";
  }
}

function nextMainId(qid){const i=MAIN_IDS.indexOf(qid);return i>=0&&i<MAIN_IDS.length-1?MAIN_IDS[i+1]:null}

function lockQuestionCard(qid,answer,showFeedback){
  const q=questionById(qid);
  const card=document.querySelector(`[data-question="${qid}"]`);
  if(!q||!card) return;
  const chosen=q.type==="single"?[answer]:answer;
  card.querySelectorAll("input").forEach(input=>{
    input.checked=chosen.includes(input.value);
    input.disabled=true;
  });
  card.classList.add("locked-question");
  const btn=card.querySelector(".question-submit");
  if(btn){btn.disabled=true;btn.textContent="Answer submitted"}
  const status=document.getElementById(`status_${qid}`);
  if(status){status.textContent="Locked";status.className="question-status locked-status"}
  if(showFeedback) renderQuestionFeedback(qid,answer);
  syncSelectedStyles();
}

function evaluateQuestion(q,raw){
  const review=[];const usedRefs=new Set();
  const selected=q.type==="single"?(raw?[raw]:[]):(Array.isArray(raw)?raw:[]);
  if(q.type==="single"){
    const chosen=q.options.find(o=>selected.includes(o.id));
    if(chosen&&chosen.grade==="wrong"){
      chosen.refs.forEach(r=>usedRefs.add(r));
      const correct=q.options.find(o=>o.grade==="correct");
      review.push({question:q.prompt,item:chosen.text,expected:correct?.text||"Incorrect",why:chosen.why,refs:chosen.refs});
    }
    return {review,usedRefs:[...usedRefs]};
  }
  for(const o of q.options){
    if(o.confidence||o.grade==="partial") continue;
    const isSelected=selected.includes(o.id);
    if(o.grade==="wrong"&&isSelected){o.refs.forEach(r=>usedRefs.add(r));review.push({question:q.prompt,item:o.text,expected:"Should not be selected",why:o.why,refs:o.refs})}
    if(o.grade==="correct"&&!isSelected){o.refs.forEach(r=>usedRefs.add(r));review.push({question:q.prompt,item:o.text,expected:"Should be selected",why:o.why,refs:o.refs})}
  }
  return {review,usedRefs:[...usedRefs]};
}

function renderQuestionFeedback(qid,answer){
  // Retained for final-review rendering helpers only. Per-question learning is not revealed during the quiz.
  const q=questionById(qid);const box=document.getElementById(`feedback_${qid}`);if(!q||!box)return;
  const {review,usedRefs}=evaluateQuestion(q,answer);
  if(!review.length){box.innerHTML=`<div class="feedback-ok"><strong>Answer locked.</strong> No corrections needed.</div>`;box.classList.add("show");return}
  box.innerHTML=`<div class="feedback-title">Answer locked — review</div>${review.map(renderReviewItem).join("")}${usedRefs.length?`<div class="mini-refs"><strong>References:</strong> ${esc(shortRefs(usedRefs))}</div>`:""}`;
  box.classList.add("show");
}

function applySessionState(session){
  for(const qid of MAIN_IDS){
    if(session?.lockedAnswers && Object.prototype.hasOwnProperty.call(session.lockedAnswers,qid)) lockQuestionCard(qid,session.lockedAnswers[qid],false);
  }
  applyFlowVisibility(session);
  const btn=document.getElementById("finalSubmitBtn");
  if(btn) btn.textContent=session?.mode==="practice"?"See my results":"Submit & see my results";
}

function applyFlowVisibility(session){
  const started=Boolean(session);
  const locked=session?.lockedAnswers||{};
  for(let i=0;i<MAIN_IDS.length;i++){
    const qid=MAIN_IDS[i];
    const wrapper=document.querySelector(`.quiz-section[data-first-question="${qid}"]`);
    const visible=started && (i===0 || Object.prototype.hasOwnProperty.call(locked,MAIN_IDS[i-1]));
    if(wrapper) wrapper.style.display=visible?"block":"none";
  }
  const tfWrapper=document.querySelector('.quiz-section[data-first-question="q6a"]');
  const mainComplete=MAIN_IDS.every(id=>Object.prototype.hasOwnProperty.call(locked,id));
  if(tfWrapper) tfWrapper.style.display=started&&mainComplete?"block":"none";
  const after=document.getElementById("afterMainArea");
  if(after) after.style.display=started&&mainComplete?"block":"none";
}

async function recoverRemoteStatus(session){
  try{
    const res=await api({action:"status",submission_id:session.submissionId,participant_token:session.token});
    const serverAnswers=res.quiz_answers||{};
    for(const id of MAIN_IDS){if(Object.prototype.hasOwnProperty.call(serverAnswers,id)) session.lockedAnswers[id]=serverAnswers[id]}
    saveSession(session);
    applySessionState(session);
    if(res.completed_at){
      const submission={submittedAt:res.completed_at,version:QUIZ_VERSION,nurseAcknowledged:true,resultsOnly:false,quiz:serverAnswers,feedback:{course:{},device:{},contact:{}}};
      localStorage.setItem(COMPLETED_KEY,"true");
      localStorage.setItem(EVER_SUBMITTED_KEY,"true");
      localStorage.setItem(LAST_SUBMISSION_KEY,JSON.stringify(submission));
      renderPostSubmit(submission,true,false);
    }
  }catch{/* local locked state remains usable */}
}

function optionalFieldIds(){return [...optionalFeedback.course,...optionalFeedback.device].filter(x=>x.type==="ynid").map(x=>x.id)}
function syncSelectedStyles(){document.querySelectorAll("label.option").forEach(l=>l.classList.toggle("selected",Boolean(l.querySelector("input")?.checked)))}

function collectFeedback(){
  const readRadio=id=>document.querySelector(`[name="${id}"]:checked`)?.value||null;
  const course={},device={};
  for(const f of optionalFeedback.course) course[f.id]=f.type==="text"?(document.getElementById(f.id)?.value.trim()||""):{answer:readRadio(f.id),notes:document.getElementById(`${f.id}_notes`)?.value.trim()||""};
  for(const f of optionalFeedback.device) device[f.id]=f.type==="text"?(document.getElementById(f.id)?.value.trim()||""):{answer:readRadio(f.id),notes:document.getElementById(`${f.id}_notes`)?.value.trim()||""};
  return {course,device,contact:{name:document.getElementById("contact_name")?.value.trim()||"",email:document.getElementById("contact_email")?.value.trim()||"",notes:document.getElementById("contact_notes")?.value.trim()||"",includeQuizResults:Boolean(document.getElementById("share_quiz_results")?.checked)}};
}

function collectTfAnswers(){
  const out={};
  for(const id of TF_IDS) out[id]=document.querySelector(`[name="${id}"]:checked`)?.value||null;
  return out;
}

function normalizeDevice(device){
  return Object.fromEntries(Object.entries(device||{}).map(([key,value])=>{
    if(value&&typeof value==="object"&&!Array.isArray(value)&&"answer" in value){
      const answer=value.answer==="Yes"?"yes":value.answer==="No"?"no":value.answer==="It depends"?"depends":value.answer;
      return [key,{...value,answer}];
    }
    return [key,value];
  }));
}

async function finalizeQuiz(){
  const session=getSession();if(!session)return;
  const err=document.getElementById("formError");err.classList.remove("show");
  if(!MAIN_IDS.every(id=>Object.prototype.hasOwnProperty.call(session.lockedAnswers||{},id))){err.textContent="Please submit Questions 1–5 first.";err.classList.add("show");return}
  const tf=collectTfAnswers();
  const missing=TF_IDS.filter(id=>!tf[id]);
  if(missing.length){err.textContent=`Please answer all ${missing.length} remaining True/False question${missing.length===1?"":"s"} before viewing your results.`;err.classList.add("show");err.scrollIntoView({behavior:"smooth",block:"center"});return}
  const feedback=collectFeedback();
  if(feedback.contact.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(feedback.contact.email)){err.textContent="Please enter a valid email address, or leave the optional email field blank.";err.classList.add("show");return}

  const submission={submittedAt:new Date().toISOString(),version:QUIZ_VERSION,nurseAcknowledged:session.mode==="live",resultsOnly:session.mode==="practice",quiz:{...(session.lockedAnswers||{}),...tf},feedback};
  const btn=document.getElementById("finalSubmitBtn");btn.disabled=true;btn.textContent=session.mode==="practice"?"Preparing results…":"Submitting…";
  try{
    if(session.mode==="live"){
      await api({
        action:"finalize",
        submission_id:session.submissionId,
        participant_token:session.token,
        tf_answers:tf,
        device_validation:normalizeDevice(feedback.device),
        course_feedback:feedback.course,
        followup:{name:feedback.contact.name,email:feedback.contact.email,discussion_notes:feedback.contact.notes,send_quiz_to_trainer:Boolean(feedback.contact.includeQuizResults)}
      });
      localStorage.setItem(EVER_SUBMITTED_KEY,"true");
    }
    session.completed=true;saveSession(session);
    localStorage.setItem(COMPLETED_KEY,"true");
    localStorage.setItem(LAST_SUBMISSION_KEY,JSON.stringify(submission));
    renderPostSubmit(submission,false,session.mode==="practice");
  }catch(e){
    // If the network response was lost after the server finalized, recover the server state.
    if(session.mode==="live"){
      try{
        const st=await api({action:"status",submission_id:session.submissionId,participant_token:session.token});
        if(st.completed_at){
          submission.quiz=st.quiz_answers||submission.quiz;
          localStorage.setItem(EVER_SUBMITTED_KEY,"true");
          localStorage.setItem(COMPLETED_KEY,"true");
          localStorage.setItem(LAST_SUBMISSION_KEY,JSON.stringify(submission));
          return renderPostSubmit(submission,false,false);
        }
      }catch{}
    }
    btn.disabled=false;btn.textContent=session.mode==="practice"?"See my results":"Submit & see my results";
    err.textContent=e.message||"Your response could not be saved. Please check the connection and try again.";err.classList.add("show");
  }
}

function evaluateSubmission(submission){
  const review=[];const usedRefs=new Set();
  for(const q of allQuestions()){
    const {review:items,usedRefs:refs}=evaluateQuestion(q,submission.quiz?.[q.id]);
    items.forEach(x=>review.push(x));refs.forEach(x=>usedRefs.add(x));
  }
  return {review,usedRefs:[...usedRefs]};
}

function renderReviewItem(x){
  return `<article class="review-item missed"><div class="review-label">Review</div><div class="small">${esc(x.question)}</div><div class="review-title">${esc(x.item)} <span class="status incorrect">${esc(x.expected)}</span></div><p class="why">${esc(x.why)}</p><div class="small"><strong>Reference:</strong> ${esc(shortRefs(x.refs))}</div></article>`;
}

function printLearning(){document.body.classList.add("printing-learning");window.print()}
window.addEventListener("afterprint",()=>document.body.classList.remove("printing-learning"));

function startAgain(){
  localStorage.removeItem(COMPLETED_KEY);
  localStorage.removeItem(LAST_SUBMISSION_KEY);
  clearSession();
  renderParticipant();window.scrollTo({top:0,behavior:"auto"});
}

function renderPostSubmit(submission,fromReload,resultsOnly=false){
  const {review,usedRefs}=evaluateSubmission(submission);
  app.innerHTML=`
    <header class="hero"><div class="eyebrow">Making Oxygen Therapy Visible™</div><h1>${resultsOnly?"Your results":"Responses submitted"}</h1><p>${resultsOnly?"This attempt was not submitted, saved, or sent anywhere. ":"Your submitted responses are now locked. "}Below you’ll see only the answers that need correction.</p></header>
    <section class="review-panel">
      <div class="review-summary"><strong>${review.length===0?"No incorrect answers to review.":`${review.length} answer${review.length===1?"":"s"} to review.`}</strong></div>
      ${review.length?`<h2>Review</h2>${review.map(renderReviewItem).join("")}`:""}
      ${usedRefs.length?`<div class="refs"><h3>References used in your review</h3><ol>${usedRefs.map(id=>`<li><strong>${esc(references[id]?.short||id)}.</strong> ${esc(references[id]?.full||"")}</li>`).join("")}</ol></div>`:""}
      <div class="actions" style="margin-top:26px"><a class="btn btn-primary btn-link" href="https://www.conservemed.com/nurse-training" target="_blank" rel="noopener">Book 45-minute personalized nurse training</a><button class="btn btn-secondary" type="button" onclick="printLearning()">Print my learning</button><button class="btn btn-secondary" type="button" onclick="startAgain()">Start again</button></div>
      ${resultsOnly?"":`<div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line)"><a href="results.html" target="_blank" rel="noopener"><strong>View results from all participating nurses →</strong></a></div>`}
    </section>
    <div class="notice"><strong>${resultsOnly?"Learning mode.":"Thank you."}</strong> ${resultsOnly?"Nothing from this attempt was saved or sent.":"Your submitted responses are included in the live dashboard."}</div>`;
  window.scrollTo({top:0,behavior:fromReload?"auto":"smooth"});
}

renderParticipant();

</script>
